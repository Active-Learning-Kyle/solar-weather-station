name: Bug report
description: Report a reproducible firmware, backend, hardware or documentation problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the station. Please remove credentials, precise private location data and personal paths before submitting evidence.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Firmware · production environment
        - Firmware · diagnostic environment
        - Backend or API
        - Dashboard
        - Electronics or wiring
        - CAD, enclosure or assembly
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release, branch or commit SHA where the problem was observed.
      placeholder: v0.4 or abc1234
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Test setup
      description: Board, modules, power source, environment and relevant software versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Build ...
        2. Connect ...
        3. Run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed result and evidence
      description: Include relevant logs, measurements or redacted screenshots. State how often the failure occurred.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Publication check
      options:
        - label: I removed secrets, precise private coordinates and personal information from this report.
          required: true
