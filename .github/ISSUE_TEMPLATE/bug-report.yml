name: Bug or observed failure
description: Record a reproducible hardware, firmware, data, or documentation failure
title: "[Bug]: "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: What happened, including the failure time and conditions?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour or acceptance criterion
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Configuration and revisions
      description: Hardware, firmware, CAD, BOM, sensor, and environment details.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps and evidence
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Immediate safety action
      description: State whether operation should stop or equipment should be isolated.

